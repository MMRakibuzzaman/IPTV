name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Publish Desktop
        run: dotnet publish IPTV.Desktop/IPTV.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish-desktop
        
      - name: Create Windows Installer
        if: matrix.os == 'windows-latest'
        run: iscc installer.iss
        
      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-win-x64-Installer
          path: Output/IPTV_Setup_Windows.exe


  build-android:
    name: Build Android APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install .NET Workloads
        run: dotnet workload install android
        
      - name: Publish Android APK
        run: dotnet publish IPTV.Android/IPTV.Android.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -o publish-android
        
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Android-APK
          path: publish-android/*-Signed.apk

  release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Build' }}
          files: artifacts/**/*
