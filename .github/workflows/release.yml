name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
          - os: ubuntu-latest
            rid: linux-x64
            ext: ""
          - os: macos-latest
            rid: osx-x64
            ext: .app
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Publish Desktop
        run: dotnet publish IPTV.Desktop/IPTV.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish-desktop
        
      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-${{ matrix.rid }}
          path: publish-desktop/*

  build-android:
    name: Build Android APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install .NET Workloads
        run: dotnet workload install android
        
      - name: Publish Android APK
        run: dotnet publish IPTV.Android/IPTV.Android.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -o publish-android
        
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Android-APK
          path: publish-android/*-Signed.apk

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install .NET Workloads
        run: dotnet workload install ios
        
      - name: Build iOS App
        run: dotnet build IPTV.iOS/IPTV.iOS.csproj -c Release -f net10.0-ios -p:ValidateXcodeVersion=false
        
      # Note: iOS requires provisioning profiles and certificates to create a signed .ipa.
      # This step just builds the raw .app file.
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-iOS
          path: IPTV.iOS/bin/Release/net10.0-ios/ios-arm64/*.app

  release:
    name: Create GitHub Release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
